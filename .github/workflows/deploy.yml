name: CI — Build & Lint Check

# Runs on every push and PR to catch build errors before Vercel deploys.
# Actual deployment is handled automatically by Vercel on push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portfolio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Use safe placeholder values so the build succeeds in CI
          # Real secrets live in Vercel Environment Variables
          ADMIN_PASSWORD: ci-placeholder-password
          TOKEN_SECRET: ci-placeholder-secret-key-for-build-only-not-real
          NODE_ENV: production
